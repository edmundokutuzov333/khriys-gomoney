name: WALK TO THE BANK - Official M4A Audio Only
on:
  push:
    branches: [main]
    paths:
      - 'public/audiooficial/**'
  workflow_dispatch:
  workflow_run:
    workflows: ['WALK TO THE BANK V3 - Verified Cinema Release']
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: walk-to-the-bank-official-audio-sync
  cancel-in-progress: false

jobs:
  replace-music-without-touching-picture:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout final V3 on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install standalone pinned FFmpeg binary without apt or paid services
        run: |
          python -m pip install --disable-pip-version-check 'imageio-ffmpeg==0.6.0'
          mkdir -p "$RUNNER_TEMP/ffmpeg-bin"
          ln -s "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/ffmpeg-bin/ffmpeg"
          echo "$RUNNER_TEMP/ffmpeg-bin" >> "$GITHUB_PATH"
      - name: Verify final source is present and generate official audio beat map
        run: |
          set -euo pipefail
          node --test tests/integrity.test.mjs
          test -s public/audiooficial/walktothebank.m4a
          ffmpeg -version | head -1
          python scripts/analyze_audio.py public/audiooficial/walktothebank.m4a --output public/audio-map.json --duration 158
          python - <<'PY'
          import json
          m=json.load(open('public/audio-map.json'))
          assert m['sourceDuration']>100
          assert m['targetDuration']==158
          assert len(m['beats'])>20
          print('Final official M4A analyzed:',m['sourceDuration'],'seconds,',len(m['beats']),'beat cues')
          PY
      - name: Download last verified V3 picture master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/original-film"
          gh release download visualizer-v3 -p 'walk-to-the-bank-v3.mp4' -D "$RUNNER_TEMP/original-film"
          test "$(stat -c%s "$RUNNER_TEMP/original-film/walk-to-the-bank-v3.mp4")" -gt 1000000
      - name: Replace ONLY the soundtrack; copy all existing video packets unchanged
        run: |
          set -euo pipefail
          mkdir -p build
          ffmpeg -hide_banner -v error -y \
            -i "$RUNNER_TEMP/original-film/walk-to-the-bank-v3.mp4" \
            -i public/audiooficial/walktothebank.m4a \
            -map 0:v:0 -map 1:a:0 \
            -c:v copy -c:a aac -b:a 256k -af apad \
            -t 158 -movflags +faststart \
            build/walk-to-the-bank-v3.mp4
          test -s build/walk-to-the-bank-v3.mp4
      - name: Forensic verification video is bit-identical and audio is official
        run: |
          python - <<'PY'
          import pathlib,subprocess,re
          old=pathlib.Path(__import__('os').environ['RUNNER_TEMP'])/'original-film'/'walk-to-the-bank-v3.mp4'
          new=pathlib.Path('build/walk-to-the-bank-v3.mp4')
          official=pathlib.Path('public/audiooficial/walktothebank.m4a')
          def picture_hash(p):
              return subprocess.check_output(['ffmpeg','-v','error','-i',str(p),'-map','0:v:0','-c:v','copy','-f','hash','-hash','SHA256','-'],text=True).strip()
          h1,h2=picture_hash(old),picture_hash(new)
          assert h1==h2, 'Visual edit changed; abort audio-only release'
          def inspect(p):
              r=subprocess.run(['ffmpeg','-hide_banner','-i',str(p)],capture_output=True,text=True)
              return r.stderr
          src=inspect(official);out=inspect(new)
          assert 'Audio:' in src and 'Audio: aac' in out, 'Official soundtrack not encoded'
          m=re.search(r'Duration:\s*(\d+):(\d+):(\d+(?:\.\d+)?)',out)
          assert m and abs(int(m.group(1))*3600+int(m.group(2))*60+float(m.group(3))-158)<0.15,'Incorrect visualizer duration'
          assert 'Video: h264' in out,'Lost V3 picture stream'
          print('PASSED: exact V3 video SHA256:',h2,'; final M4A muxed; AAC and 02:38 verified')
          PY
      - name: Publish downloadable V3 with final official music
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload visualizer-v3 build/walk-to-the-bank-v3.mp4 --clobber
      - name: Commit updated rhythm map for online playback, no branches
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/audio-map.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore(audio): synchronize official M4A beats with V3 image effects'
            git fetch origin main
            git merge --no-edit origin/main
            git push origin HEAD:main
          fi
