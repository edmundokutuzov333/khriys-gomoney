name: Import cinema V2 onto main
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bootstrap.yml']
permissions:
  contents: write
jobs:
  apply-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Import exact reviewed V2 source archive
        run: |
          set -euo pipefail
          curl -fLsS --retry 4 --retry-all-errors --retry-delay 3 --max-time 180 \
            'https://at.adobe.com/XUwIdf6sLv3ctADy' -o /tmp/walk-to-bank-v2.zip
          echo '622d2a51b021095772442b03ffbdba946c9d8644250c2be9ba71c466567e7584  /tmp/walk-to-bank-v2.zip' | sha256sum --check
          unzip -oq /tmp/walk-to-bank-v2.zip -d .
          test -s public/src/vfx.js
          test -s scripts/vfx.py
          test -s tests/test_vfx.py
          echo 'b762e2dec3df181e2e4539791f40886ab422e91f4d621a236399148ccb4cbd66  public/cover.png' | sha256sum --check
          test -s walk_to_the_bank.mp3
      - name: Python runtime for reproducible offline tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned free OpenCV and NumPy
        run: python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'opencv-python-headless==4.11.0.86'
      - name: Test source, VFX geometry, identity masks and site packaging
        run: |
          npm test
          npm run build
          python -m py_compile scripts/vfx.py scripts/render.py
          echo 'All verification passed; pushing source files to main.'
      - name: Atomic source commit on main without workflow permissions
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':!.github/workflows'
          if ! git diff --cached --quiet; then
            git commit -m 'feat(v2): cinematic body echoes, four underground VFX styles and integrity checks'
            git push origin HEAD:main
          fi
