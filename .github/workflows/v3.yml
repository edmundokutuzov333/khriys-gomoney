name: Real Motion V3 Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/src/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/v3.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: npm test
