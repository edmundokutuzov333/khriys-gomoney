name: WALK TO THE BANK V3 - Verified Cinema Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/src/**'
      - 'public/index.html'
      - 'public/cover.png'
      - 'public/motion-loop.mp4'
      - 'public/guard.png'
      - 'walk_to_the_bank.mp3'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: walk-to-the-bank-v3-master
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout original assets on main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install free pinned tools
        run: |
          sudo apt-get install -y ffmpeg
          python -m pip install --disable-pip-version-check 'numpy==2.2.6' 'opencv-python-headless==4.11.0.86'
      - name: Inspect exact original photo and stored motion source
        run: |
          set -euo pipefail
          echo 'b762e2dec3df181e2e4539791f40886ab422e91f4d621a236399148ccb4cbd66  public/cover.png' | sha256sum --check
          test -s public/motion-loop.mp4
          test -s walk_to_the_bank.mp3
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 public/motion-loop.mp4
      - name: Execute complete JS and Python motion / VFX regression suites
        run: |
          npm test
          python scripts/guard.py --image public/cover.png --video public/motion-loop.mp4 --score build/score.json --output build/guard.png
          python scripts/analyze_audio.py walk_to_the_bank.mp3 --output build/audio-map.json --duration 158
          npm run build
      - name: Encode cinema master using stored moving actors with identity protection
        run: |
          python scripts/render.py --image public/cover.png --motion public/motion-loop.mp4 --guard build/guard.png --audio walk_to_the_bank.mp3 --score build/score.json --map build/audio-map.json --output build/walk-to-the-bank-v3.mp4 --width 1920 --height 1080 --fps 24 --duration 158 --crf 21 --preset veryfast
      - name: Check codec, complete sound, exact duration and frame count
        run: |
          python - <<'PY'
          import json,subprocess,os
          p='build/walk-to-the-bank-v3.mp4'
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',p]))
          v=next(s for s in d['streams'] if s['codec_type']=='video')
          a=next(s for s in d['streams'] if s['codec_type']=='audio')
          assert (v['width'],v['height'])==(1920,1080)
          assert v['codec_name']=='h264' and a['codec_name']=='aac'
          assert int(v['nb_frames'])==3792
          assert abs(float(d['format']['duration'])-158)<0.08
          assert os.path.getsize(p)>1000000
          print('Cinema release passed 30 automated tests and 158-second media verification')
          PY
      - name: Publish permanent direct download assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view visualizer-v3 >/dev/null 2>&1; then
            gh release upload visualizer-v3 build/walk-to-the-bank-v3.mp4 public/motion-loop.mp4 --clobber
          else
            gh release create visualizer-v3 build/walk-to-the-bank-v3.mp4 public/motion-loop.mp4 --target main --title 'WALK TO THE BANK - V3 Real Motion' --notes 'Verified 158-second underground trap visualizer with photo-locked faces, packaging and chalkboard, and original music.'
          fi
